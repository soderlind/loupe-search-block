name: Manually Build release zip

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to deploy'
        required: true
        type: string
        default: ''

jobs:
  build:
    name: Build release zip
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Build assets
        run: |
          npm ci
          npm run build


      - name: Stage release files
        run: |
          mkdir -p /tmp/loupe-search-block
          rsync -a \
            --exclude='.git/' \
            --exclude='node_modules/' \
            --exclude-from='.distignore' \
            . /tmp/loupe-search-block/

      - name: Archive Release
        working-directory: /tmp
        run: zip -r ${{ github.workspace }}/loupe-search-block.zip loupe-search-block/

      - name: Upload zip to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" loupe-search-block.zip --clobber
          else
            gh release create "$TAG" loupe-search-block.zip --title "$TAG" --generate-notes
          fi
